name: Rebuild CI

on:
  push:
    branches:
      - cursor/neon-drizzle-better-auth-rebuild-909d
      - agent/p0-integrated-execution-20260804
  pull_request:
    branches:
      - main
      - cursor/neon-drizzle-better-auth-rebuild-909d
      - cursor/p0-4g-readiness-closure-909d

jobs:
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Audit all dependencies for high severity
        run: npm run audit:tooling

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Guard no legacy backend
        run: npm run guard:no-legacy-backend

      - name: Guard import boundaries
        run: npm run guard:boundaries

      - name: Verify schema drift
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle lib/db/schema
